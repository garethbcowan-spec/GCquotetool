<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GC Quote Builder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }
  .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #666; margin-bottom: 1rem; }
  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fff; margin-bottom: 10px; outline: none; }
  input[type=text]:focus { border-color: #378ADD; }
  .sku-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .sku-card.shipping { border-color: #1D9E75; background: #f0fdf7; }
  .sku-name { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .sku-card.shipping .sku-name { color: #085041; }
  .tier-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .tier-btn { border: 1px solid #ddd; border-radius: 8px; padding: 8px 4px; background: #fff; cursor: pointer; text-align: center; transition: all 0.15s; }
  .tier-btn:hover:not(.disabled) { border-color: #378ADD; background: #f0f7ff; }
  .tier-btn.active { background: #e6f1fb; border-color: #185FA5; }
  .tier-btn.disabled { opacity: 0.35; cursor: default; }
  .tier-label { font-size: 11px; color: #888; display: block; margin-bottom: 2px; }
  .tier-btn.active .tier-label { color: #185FA5; }
  .tier-price { font-size: 13px; font-weight: 600; color: #1a1a1a; display: block; }
  .tier-btn.active .tier-price { color: #0C447C; }
  .ship-btn { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; background: #fff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s; }
  .ship-btn:hover { border-color: #1D9E75; }
  .ship-btn.active { background: #e6f1fb; border-color: #185FA5; }
  .ship-btn-label { font-size: 13px; color: #1a1a1a; }
  .ship-btn.active .ship-btn-label { color: #0C447C; font-weight: 600; }
  .ship-price { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .ship-btn.active .ship-price { color: #0C447C; }
  .qty-row { display: flex; align-items: center; gap: 8px; background: #f9f9f9; border-radius: 8px; padding: 8px 10px; }
  .qty-btn { width: 30px; height: 30px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 18px; color: #1a1a1a; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.1s; }
  .qty-btn:hover { background: #f0f0f0; }
  .qty-num { font-size: 15px; font-weight: 600; min-width: 24px; text-align: center; }
  .qty-label { font-size: 12px; color: #666; flex: 1; }
  .qty-total { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .section-label { font-size: 11px; font-weight: 600; color: #999; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; margin-top: 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  .clear-btn { font-size: 12px; color: #999; cursor: pointer; border: none; background: none; padding: 0; text-transform: none; letter-spacing: 0; }
  .clear-btn:hover { color: #e24b4a; }
  .summary-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 12px; }
  .cart-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
  .cart-item:last-child { border-bottom: none; }
  .cart-name { font-size: 13px; font-weight: 500; color: #1a1a1a; }
  .cart-detail { font-size: 12px; color: #888; margin-top: 2px; }
  .cart-price { font-size: 13px; font-weight: 600; color: #1a1a1a; white-space: nowrap; margin-left: 8px; }
  .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 2px solid #1a1a1a; }
  .total-label { font-size: 15px; font-weight: 600; }
  .total-val { font-size: 26px; font-weight: 700; }
  .empty { font-size: 13px; color: #aaa; padding: 16px 0; text-align: center; }
</style>
</head>
<body>

  <h1>GC Quote Builder</h1>
  <p class="sub">Select a pricing tier and quantity for each product</p>
  <input type="text" id="search" placeholder="Search products..." oninput="renderSkus()">
  <div id="sku-list"></div>
  <div class="section-label">
    Quote summary
    <button class="clear-btn" onclick="clearCart()">Clear all</button>
  </div>
  <div class="summary-card">
    <div id="cart"></div>
    <div class="total-row">
      <span class="total-label">Total</span>
      <span class="total-val" id="grand-total">$0</span>
    </div>
  </div>
  <div style="height: 2rem;"></div>
</div>
